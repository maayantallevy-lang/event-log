name: event_log
description: יומנון - תיעוד מהיר של כל דבר שדורש מעקב (תינוק, הריון, תרופות, בריאות).
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  fl_chart: ^0.70.0
  share_plus: ^11.0.0
  google_sign_in: ^7.2.0
  http: ^1.2.2
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # פונטים מקומיים (OFL, רישיונות ב-assets/fonts/OFL-*.txt) כדי שיעבדו גם בלי רשת.
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
        - asset: assets/fonts/Heebo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: Assistant
      fonts:
        - asset: assets/fonts/Assistant-Regular.ttf
        - asset: assets/fonts/Assistant-Medium.ttf
          weight: 500
        - asset: assets/fonts/Assistant-Bold.ttf
          weight: 700
    - family: VarelaRound
      fonts:
        - asset: assets/fonts/VarelaRound-Regular.ttf
