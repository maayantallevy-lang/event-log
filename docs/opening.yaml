answers:
  - q: 2.1 המוצר והחזון
    a: יומן אירועים לניובורן - טיטולים, האכלות, תרופות, שינה, תורים - תיעוד בשתי נגיעות, יומן עם פילטרים, גרפים ל-24 שעות
    source: המבקש
  - q: 2.2 קהלים ותפקידים
    a: הורה אחד בטלפון אחד (MVP). בהמשך בן/בת זוג. אין תפקידים/הרשאות
    source: ברירת מחדל
  - q: 2.3 תהליכים עסקיים
    a: תיעוד אירוע, תזכורת לפי מרווח, תור + שאלון אחרי + משימות מעקב
    source: המבקש
  - q: 2.4 כסף
    a: חינם ב-MVP. שלב 3 - באנר AdMob + הסרת פרסומות 10-15 ש"ח (⚑ מחיר)
    source: ברירת מחדל
  - q: 2.5 חשבוניות ומס
    a: לא רלוונטי (Google Play גובה)
  - q: 2.6 שפות
    a: עברית בלבד, RTL. אנגלית בשלב 2
    source: המבקש
  - q: 2.7 מכשירים
    a: אנדרואיד 7+ (minSdk 24). טלפון בלבד
    source: ברירת מחדל
  - q: 2.8 אינטגרציות
    a: אין. ייצוא CSV דרך share. אופציונלי - פתיחת יומן גוגל לתור (שלב 2)
  - q: 2.9 תוכן ושיווק
    a: קבוצות הורים בוואטסאפ/פייסבוק. אין אתר ב-MVP
  - q: 2.10 משפטי ופרטיות
    a: הכל מקומי במכשיר, אין איסוף. הצהרה "לא מכשיר רפואי" בהגדרות. מדיניות פרטיות לפני Play (⚑)
  - q: 2.11 אירוח ותקציב
    a: אין שרת. GitHub Actions חינמי. 25$ חשבון Play (⚑ מתי)
  - q: 2.12 נפחים
    a: עד ~50 אירועים ביום, שנה אחורה - SQLite מספיק
  - q: 2.13 דוחות
    a: גרפים ליום לסוג + סכום שדה מספרי; ייצוא CSV
    source: המבקש
  - q: 2.14 הרשאות, ייבוא, תמיכה
    a: אין ייבוא. תמיכה - המבקש בעצמו
  - q: 2.15 הצלחה
    a: המבקש מפסיק להשתמש בפתקים/וואטסאפ לתיעוד תוך שבוע
